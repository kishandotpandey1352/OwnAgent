name: phase3-quality

on:
  pull_request:
  push:
    branches: [main, feature/multi-agent-coordinator]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff mypy bandit pip-audit
      - run: ruff check app test_3i_e_h_remaining.py test_3j_governance.py test_3k_automation.py
      - run: python -m compileall app
      - run: python test_3i_a_contracts.py
      - run: python test_3i_a_registry.py
      - run: python test_3i_b_specialist_wrappers.py
      - run: python test_3i_c_coordinator.py
      - run: python test_3i_d_runtime.py
      - run: python test_3i_e_h_remaining.py
      - run: python test_3i_g_hardening.py
      - run: python test_3j_governance.py
      - run: python test_3j_data_governance.py
      - run: python test_3j_alerting.py
      - run: python test_3k_automation.py
      - run: python test_3k_outbox_permissions_ordering.py
      - run: python test_3k_hardening.py
      - run: bandit -q -r app
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm audit --audit-level=high
