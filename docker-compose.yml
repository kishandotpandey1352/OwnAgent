services:
  finance-ai-platform:
    build: .
    container_name: finance-ai-platform
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    gpus: all
    depends_on:
      - vllm-server
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: finance-vllm-server
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./outputs:/app/outputs
    ports:
      - "8001:8000"
    gpus: all
    ipc: host
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --served-model-name finance-qwen1.5b
      --dtype float16
      --max-model-len 1024
      --gpu-memory-utilization 0.85
      --enforce-eager

  data-cleaner:
    build: .
    container_name: finance-data-cleaner
    volumes:
      - .:/app
    env_file:
      - .env
    command: python src/data/clean.py --dataset all

  prometheus:
    image: prom/prometheus:latest
    container_name: finance-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - finance-ai-platform

  grafana:
    image: grafana/grafana:latest
    container_name: finance-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-storage: